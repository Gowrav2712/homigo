{% extends "admin/base_site.html" %}

{% block usertools %}
  {% if security_unresolved_count > 0 %}
    <a href="{% url 'admin:security_securityevent_changelist' %}"
       style="background: #e53935;
              color: white !important;
              padding: 5px 12px;
              border-radius: 14px;
              font-weight: 700;
              font-size: 12px;
              text-decoration: none;
              margin-right: 14px;
              display: inline-flex;
              align-items: center;
              gap: 5px;
              box-shadow: 0 2px 6px rgba(229,57,53,0.4);
              vertical-align: middle;">
      &#128274; Security Alerts ({{ security_unresolved_count }})
    </a>
  {% endif %}
  {{ block.super }}
{% endblock %}
